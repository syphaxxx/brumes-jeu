# Annonce chaque version publiée sur le canal Discord.
# L'adresse du webhook est le secret DISCORD_WEBHOOK du dépôt : jamais dans un fichier (le dépôt est public).
name: Annonce Discord
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  annonce:
    runs-on: ubuntu-latest
    steps:
      - name: Annoncer la version sur Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOM: ${{ github.event.release.name }}
          LIEN: ${{ github.event.release.html_url }}
          RESUME: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "Pas de webhook : annonce impossible."; exit 1; fi
          # Le message garde le résumé (avant la ligne ---) ; Discord limite un message à 2000 caractères.
          COURT=$(printf '%s' "$RESUME" | sed '/^---/,$d' | head -c 1700)
          TEXTE=$(printf '**%s est disponible !**
Télécharger / Download : %s

%s' "$NOM" "$LIEN" "$COURT")
          jq -n --arg c "$TEXTE" '{content: $c, username: "Brumes"}' > message.json
          # wait=true : Discord répond avec le message créé ; une erreur fait échouer l'étape, elle ne passe plus inaperçue.
          curl -sS -f -H "Content-Type: application/json" -d @message.json "$DISCORD_WEBHOOK?wait=true" | jq -r '"Message Discord créé : " + .id'
